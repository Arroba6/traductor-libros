name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.36" setuptools

      - name: Caché de compilación
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Compilar la APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Guardar el registro de errores
        if: failure()
        shell: bash
        run: |
          tail -n 600 build.log > registro.txt || echo "sin registro" > registro.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan registro-errores
          git rm -rf --cached . > /dev/null
          git add registro.txt
          git commit -m "Registro de la compilación fallida"
          git push -f origin registro-errores

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: traductor-libros-apk
          path: bin/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Traductor de Libros ${{ github.run_number }}
          body: Descarga el archivo .apk de abajo e instálalo en tu móvil.
          files: bin/*.apk
